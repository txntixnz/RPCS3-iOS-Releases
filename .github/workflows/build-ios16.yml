      - name: Download official RPCS3 0.7.1 IPA
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3             "https://github.com/XITRIX/RPCS3-iOS-Releases/releases/download/v0.7.1/RPCS3.ipa"             -o RPCS3_original_v0.7.1.ipa
          echo "b2a6f97005940943cdd1d41980eb9a29fcf3dbef8e792edba6313efb355315f9  RPCS3_original_v0.7.1.ipa" | sha256sum -c -

      - name: Extract upstream IPA
        shell: bash
        run: |
          set -euxo pipefail
          unzip -q RPCS3_original_v0.7.1.ipa -d work

      - name: Apply iOS 16 V7 patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/build_rpcs3_ios16.py

      - name: Remove stale signatures and package IPA
        shell: bash
        run: |
          set -euxo pipefail
          find build/rpcs3_ios16_build/Payload -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          cd build/rpcs3_ios16_build
          zip -qry ../../dist/RPCS3_iOS16_0.7.1_DIAGNOSTIC_V7_TOCHARS.ipa Payload
          cd ../..
          sha256sum dist/RPCS3_iOS16_0.7.1_DIAGNOSTIC_V7_TOCHARS.ipa > dist/RPCS3_iOS16_0.7.1_DIAGNOSTIC_V7_TOCHARS.ipa.sha256

      - name: Upload V7 IPA
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-iOS16-0.7.1-DIAGNOSTIC-V7-TOCHARS
          path: |
            dist/RPCS3_iOS16_0.7.1_DIAGNOSTIC_V7_TOCHARS.ipa
            dist/RPCS3_iOS16_0.7.1_DIAGNOSTIC_V7_TOCHARS.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
