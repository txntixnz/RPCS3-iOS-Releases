name: RPCS3 iOS 16 - Auto Sync & Build

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if this upstream release was already built
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: rpcs3-ios16-auto
  cancel-in-progress: false

jobs:
  ios16:
    name: Sync latest upstream release and build iOS 16 IPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout compatibility workflow repository
        uses: actions/checkout@v4

      - name: Resolve newest upstream iOS release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/XITRIX/RPCS3-iOS-Releases/releases?per_page=20' \
            -o /tmp/releases.json
          python3 - <<'PYRES'
          import json, os
          releases=json.load(open('/tmp/releases.json','r',encoding='utf-8'))
          selected=None
          for rel in releases:
              if rel.get('draft'):
                  continue
              assets=rel.get('assets') or []
              ipa=None
              for a in assets:
                  name=(a.get('name') or '').lower()
                  if name == 'rpcs3.ipa':
                      ipa=a; break
              if ipa is None:
                  for a in assets:
                      name=(a.get('name') or '').lower()
                      if name.endswith('.ipa') and 'vision' not in name:
                          ipa=a; break
              if ipa:
                  selected=(rel,ipa); break
          if not selected:
              raise SystemExit('No upstream iOS IPA release asset was found.')
          rel,ipa=selected
          tag=rel['tag_name']
          url=ipa['browser_download_url']
          print('Selected upstream release:',tag,ipa['name'])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'tag={tag}\n')
              f.write(f'url={url}\n')
              f.write(f'asset={ipa["name"]}\n')
          PYRES

      - name: Restore successful-build marker
        id: marker
        uses: actions/cache@v4
        with:
          path: .rpcs3-ios16-built-marker
          key: rpcs3-ios16-success-${{ steps.upstream.outputs.tag }}

      - name: Decide whether to build
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          FORCE='${{ inputs.force_build }}'
          if [ '${{ steps.marker.outputs.cache-hit }}' = 'true' ] && \
             ! { [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ "$FORCE" = 'true' ]; }; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'Latest upstream release was already built successfully; nothing to do.'
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo 'A build is required.'
          fi

      - name: Download newest upstream IPA
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 '${{ steps.upstream.outputs.url }}' -o RPCS3_upstream.ipa
          sha256sum RPCS3_upstream.ipa
          rm -rf work build dist prebuilt generated
          mkdir -p work build dist prebuilt generated
          unzip -q RPCS3_upstream.ipa -d work
          test -f work/Payload/RPCS3.app/RPCS3
          test -f work/Payload/RPCS3.app/Frameworks/libRPCS3Core.dylib

