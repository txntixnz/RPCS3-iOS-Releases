      - name: Compile iOS 16 compatibility launcher
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          clang --version
          clang -target arm64-apple-ios16.0 -c -Oz \
            -fno-stack-protector -fno-builtin -fno-asynchronous-unwind-tables \
            -o prebuilt/rpcs3_compat_launcher_v09.o \
            generated/rpcs3_compat_launcher.c
          file prebuilt/rpcs3_compat_launcher_v09.o

      - name: Apply adaptive iOS 16 compatibility port
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          RPCS3_IOS16_ROOT="$GITHUB_WORKSPACE" \
            python3 generated/build_rpcs3_ios16_auto.py

      - name: Verify patched bundle
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYVERIFY'
          import plistlib, struct, pathlib
          app=pathlib.Path('build/rpcs3_ios16_build/Payload/RPCS3.app')
          info=plistlib.load(open(app/'Info.plist','rb'))
          assert info.get('MinimumOSVersion')=='16.0', info.get('MinimumOSVersion')
          assert 'UIApplicationSceneManifest' not in info
          assert not (app/'PlugIns').exists()
          def minos(path):
              b=path.read_bytes(); n=struct.unpack_from('<I',b,16)[0]; o=32
              for _ in range(n):
                  cmd,sz=struct.unpack_from('<II',b,o)
                  if cmd==0x32:
                      v=struct.unpack_from('<I',b,o+12)[0]
                      return (v>>16,(v>>8)&255,v&255)
                  o+=sz
              return None
          assert minos(app/'RPCS3')==(16,0,0), minos(app/'RPCS3')
          assert minos(app/'Frameworks/libRPCS3Core.dylib')==(16,0,0), minos(app/'Frameworks/libRPCS3Core.dylib')
          print('Bundle verification passed; upstream version',info.get('CFBundleShortVersionString'))
          PYVERIFY

      - name: Package iOS 16 IPA
        if: steps.decision.outputs.build == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          TAG='${{ steps.upstream.outputs.tag }}'
          SAFE_TAG="${TAG//\//_}"
          cd build/rpcs3_ios16_build
          zip -qry "../../dist/RPCS3_iOS16_${SAFE_TAG}.ipa" Payload
          cd ../..
          unzip -tq "dist/RPCS3_iOS16_${SAFE_TAG}.ipa"
          sha256sum "dist/RPCS3_iOS16_${SAFE_TAG}.ipa" > "dist/RPCS3_iOS16_${SAFE_TAG}.ipa.sha256"
          printf '%s\n' "$TAG" > dist/UPSTREAM_TAG.txt
          ls -lh dist/

      - name: Upload iOS 16 build
        if: steps.decision.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-iOS16-${{ steps.upstream.outputs.tag }}
          path: |
            dist/*.ipa
            dist/*.sha256
            dist/UPSTREAM_TAG.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Mark upstream release as successfully built
        if: steps.decision.outputs.build == 'true' && success()
        shell: bash
        run: |
          printf '%s\n' '${{ steps.upstream.outputs.tag }}' > .rpcs3-ios16-built-marker

      - name: Up-to-date summary
        if: steps.decision.outputs.build != 'true'
        run: echo 'RPCS3 iOS 16 is already built for upstream ${{ steps.upstream.outputs.tag }}.'
